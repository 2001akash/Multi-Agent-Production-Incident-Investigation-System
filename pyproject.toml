[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orange-incident-investigation"
version = "0.1.0"
description = "Multi-agent incident investigation system with synthetic evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
